<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIC Listings Investigator</title>
<link rel="stylesheet" href="styles/main.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-main">
    <div class="brand">
      <h1>LIC Listings Investigator</h1>
      <p>Resolve addresses with image-cluster evidence</p>
    </div>
    <div class="stats">
      <span class="stat resolved" id="stat-resolved">0 resolved</span>
      <span class="stat pending" id="stat-pending">0 pending</span>
      <span class="stat shared" id="stat-shared">0 connected listings</span>
      <span class="stat clusters" id="stat-clusters">0/0 clusters resolved</span>
      <span class="stat" id="stat-total">0 listings</span>
    </div>
  </div>

  <details class="topbar-controls" open>
    <summary>Filters &amp; Actions</summary>
    <div class="controls-grid">
      <div class="control-group">
        <label for="filter-status">Status</label>
        <select id="filter-status">
          <option value="all">All</option>
          <option value="pending">Pending</option>
          <option value="resolved">Resolved</option>
          <option value="shared-images">Connected Listings</option>
          <option value="current-component">Current Component</option>
          <option value="unresolved-current-component">Unresolved In Current Component</option>
          <option value="resolved-current-component">Resolved In Current Component</option>
        </select>
      </div>

      <div class="control-group">
        <label for="filter-beds">Bedrooms</label>
        <select id="filter-beds">
          <option value="all">All Beds</option>
          <option value="3">3 BR</option>
          <option value="4">4+ BR</option>
        </select>
      </div>

      <div class="control-group">
        <label for="filter-search">Search</label>
        <input type="text" id="filter-search" placeholder="Title, address, notes, description...">
      </div>

      <div class="control-group">
        <label>Sidebar View</label>
        <div class="view-toggle">
          <button type="button" id="view-flat" data-action="set-sidebar-mode" data-mode="flat">Flat</button>
          <button type="button" id="view-clustered" data-action="set-sidebar-mode" data-mode="clustered">By Cluster</button>
        </div>
      </div>

      <div class="control-group actions-group">
        <label>Data Actions</label>
        <div class="control-actions">
          <button class="action-btn" type="button" data-action="export-state">Export</button>
          <button class="action-btn" type="button" data-action="open-import">Import</button>
          <button class="action-btn" type="button" data-action="reload-data">Reload Data</button>
        </div>
        <input type="file" id="import-file" accept=".json" style="display:none;">
      </div>
    </div>
  </details>
</div>

<div class="progress-wrap"><div class="progress-fill" id="progress-fill"></div></div>

<div class="container">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main" id="main">
    <div class="empty" id="empty-state">
      <div class="load-section">
        <p>Load <code>listings.json</code> and <code>hash-graph/listing-graph.json</code> to begin.</p>
        <div>
          <label class="load-btn">
            Load listings.json
            <input type="file" id="load-listings-file" accept=".json">
          </label>
          <label class="load-btn" style="margin-left: 8px;">
            Load listing-graph.json
            <input type="file" id="load-graph-file" accept=".json">
          </label>
        </div>
        <p style="font-size:12px; color: var(--dim);">If this folder is served locally, data will auto-load from <code>data/</code>.</p>
      </div>
    </div>
  </main>
</div>

<script src="config.js"></script>
<script src="config.local.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
